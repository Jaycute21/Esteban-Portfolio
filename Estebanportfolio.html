<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Esteban.css">
</head>
<body data-theme="light">

<nav>
  <div class="left">
    <div class="brand">MY PORTFOLIO</div>
    <div class="tabs">
      <button class="tab active" data-page="home">HOME</button>
      <button class="tab" data-page="quiz">QUIZ</button>
      <button class="tab" data-page="exam">EXAM</button>
      <button class="tab" data-page="activity">ACTIVITY</button>
    </div>
  </div>
  <button id="theme-toggle" aria-label="Toggle dark and light mode">
    <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
</nav>

<main>

  <!-- HOME -->
  <section class="page active" id="page-home">
    <div class="profile-wrap">
      <!-- Left side: Welcome text -->
      <div class="welcome-text-side">
        <h1>WELCOME BACK, CUTE</h1>
        <p class="hero-sub">HEALTH IS WEALTH.</p>
      </div>

      <!-- Right side: Profile component (photo, prominent H2 name, section) --> 
      <div class="profile-avatar-block">
        <div class="avatar prominent-avatar">
          <img id="avatar-img" alt="Profile photo">
        </div>
        <h2 class="profile-name">Jay Hans Esteban</h2>
        <p class="section-line">CS3B &middot; DCIT 26</p>
      </div>
    </div>

    <!-- Dashboard Stats Cards -->
    <div class="stats-container" style="display:flex; gap:20px;">
      <div class="stat-card" id="stat-card-quiz" onclick="goTo('quiz')" style="flex:1; cursor:pointer;">
        <h3>QUIZZES</h3>
        <p id="stat-quiz">0</p>
      </div>
      <div class="stat-card" id="stat-card-exam" onclick="goTo('exam')" style="flex:1; cursor:pointer;">
        <h3>EXAMS</h3>
        <p id="stat-exam">0</p>
      </div>
      <div class="stat-card" id="stat-card-activity" onclick="goTo('activity')" style="flex:1; cursor:pointer;">
        <h3>ACTIVITIES</h3>
        <p id="stat-activity">0</p>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="page" id="page-quiz">
    <div class="plain-page">
      <h1>Quiz</h1>
      <div id="quiz-list" class="quiz-grid"></div>
    </div>
  </section>

  <!-- EXAM -->
  <section class="page" id="page-exam">
    <div class="plain-page">
      <h1>Exam</h1>
      <div id="exam-list" class="quiz-grid"></div>
    </div>
  </section>

  <!-- ACTIVITY -->
  <section class="page" id="page-activity">
    <div class="plain-page">
      <h1>Activity</h1>
      <div id="activity-list" class="quiz-grid"></div>
    </div>
  </section>

  <!-- Image Zoom Modal Only (No Database Forms or Delete Modals) -->
  <div id="image-modal" class="modal">
    <div class="modal-content" style="position: relative;">
      <span class="close-modal" id="close-image-modal">&times;</span>
      <img id="modal-img" src="" alt="Zoomed Preview" style="width:100%; border-radius:8px;" />
    </div>
  </div>

</main>

<footer>Made with care by Jay Hans Esteban</footer>
<script src="Estebans.js"></script>
</body>
</html>
